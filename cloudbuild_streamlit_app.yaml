steps:
- name: 'gcr.io/cloud-builders/docker'
  id: 'Build container image'
  args: [
    'build',
    '.',
    '-t',
    'europe-west1-docker.pkg.dev/dtumlops-484207/eval/streamlit_app:latest',
    '-f',
    'dockerfiles/streamlit_app.dockerfile'
  ]
- name: 'gcr.io/cloud-builders/docker'
  id: 'Push container image'
  args: [
    'push',
    'europe-west1-docker.pkg.dev/dtumlops-484207/eval/streamlit_app:latest'
  ]

options:
  logging: CLOUD_LOGGING_ONLY
